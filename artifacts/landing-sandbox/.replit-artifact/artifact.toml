kind = "web"
previewPath = "/sandbox/"
title = "Landing — Sandbox"
version = "1.0.0"
id = "artifacts/landing-sandbox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sandbox/" ]
localPort = 22607

[services.development]
run = "pnpm --filter @workspace/landing-sandbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landing-sandbox", "run", "build" ]
publicDir = "artifacts/landing-sandbox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22607"
BASE_PATH = "/sandbox/"
